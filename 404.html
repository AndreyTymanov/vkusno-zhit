<style>
:root {
  --шрифт-заголовков: Montserrat, Manrope, system-ui, sans-serif;
  --шрифт-текста: Manrope, Montserrat, -apple-system, 'Segoe UI', sans-serif;
  --цвет-фон: #FBF8F1;  --цвет-фон-2: #F3EADB;  --цвет-фон-карточки: #FFFFFF;
  --цвет-текст: #1E3A34;  --цвет-текст-мягкий: #4F625C;  --цвет-текст-тихий: #5A6461;
  --цвет-акцент: #2F6755;  --цвет-акцент-тёмный: #C9A55C;  --цвет-акцент-яркий: #7EA08C;
  --цвет-акцент-глубже: #245444;  --цвет-акцент-маркер: #B23A2B;
  --цвет-на-акценте: #FFFFFF;  --цвет-линия: #E9ECEA;
  --цвет-тёмный-фон: #14201E;  --цвет-тёмный-фон-2: #1E3A34;  --цвет-тёмный-текст: #F3EADB;
  --цвет-тёмный-фон-3: #1E3A34;  --цвет-тёмный-фон-4: #245444;
  --цвет-тёплый: #C9A55C;  --цвет-тёплый-мягкий: #D8B873;
  --цвет-стекло: color-mix(in srgb, #14201E 86%, transparent);
  --тень: 0 18px 50px color-mix(in srgb, #1E3A34 10%, transparent);
  --тень-чип: 0 10px 30px color-mix(in srgb, #1E3A34 12%, transparent);
  --тень-глубокая: 0 24px 60px color-mix(in srgb, #14201E 35%, transparent);
  --тень-спутник: 0 30px 60px color-mix(in srgb, #14201E 70%, transparent);
  --тень-плиты: 0 40px 100px color-mix(in srgb, #14201E 70%, transparent);
  --кегль-h1: 34px;  --кегль-h2: clamp(28px, 3vw, 42px);
  --кегль-текст: 17px;  --кегль-лид: clamp(18px, 1.5vw, 22px);
  --кегль-мелкий: 16px;  --кегль-кикер: 14px;  --разрядка-кикера: .16em;
  --кегль-цифра: 30px;
  --отступ-секции: clamp(64px, 9vw, 128px);  --отступ-блока: clamp(16px, 2vw, 28px);
  --отступ-секции-тихо: clamp(48px, 7vw, 96px);  --отступ-секции-громко: clamp(72px, 10.5vw, 140px);
  --ширина: 1180px;  --ширина-колонки: 600px;  --радиус: 18px;  --радиус-малый: 10px;
  --радиус-карточки: 24px;  --радиус-плитки: 24px;  --радиус-телефон: 46px;  --кнопка-радиус: 999px;
  --радиус-модуля: 18px;  --нить: 2px;
  --плавность: cubic-bezier(.2, .7, .2, 1);  --длительность: .3s;
  --цвет-тёплый-тёмный: #8A6420;
}
@media (min-width: 900px) {
  :root { --кегль-h1: clamp(52px, 6vw, 86px); }
}
:root, .светлый { --цвет-кнопки: #2F6755; --цвет-на-кнопке: #FFFFFF; --цвет-кнопки-навёл: var(--цвет-акцент-тёмный); }
.тёмный, .липкая-кнопка--тёмная { --цвет-кнопки: #C9A55C; --цвет-на-кнопке: #14201E; --цвет-кнопки-навёл: #D3B67B; }

</style>
<script>
(function () {
  var ЭТАЛОН = 0.535;                  // очко Open Sans — текстовой гарнитуры утверждённых макетов
  var ПОТОЛОК = 1.2, МЁРТВАЯ = 0.02;   // выше потолка расползается раскладка; ближе к единице не трогаем вовсе
  var КОМПЬЮТЕР = "(min-width: 900px)";
  var ТОКЕНЫ = ["--кегль-текст", "--кегль-лид", "--кегль-мелкий", "--кегль-кикер"];
  var корень = document.documentElement;
  var холст = document.createElement("canvas").getContext("2d");
  var ждём = 0;

  function мера(буква) { var м = холст.measureText(буква); return (м && м.actualBoundingBoxAscent) || 0; }

  function применить() {
    ждём = 0;
    if (!холст) { return; }

    for (var i = 0; i < ТОКЕНЫ.length; i++) { корень.style.removeProperty(ТОКЕНЫ[i]); }
    var стиль = getComputedStyle(корень), стек = стиль.getPropertyValue("--шрифт-текста").trim();
    if (!стек) { return; }
    холст.font = "400 100px " + стек;

    var очко = Math.max(мера("х"), мера("x")) / 100;
    if (!(очко > 0)) { return; }
    var k = Math.round(Math.min(ПОТОЛОК, Math.max(1, ЭТАЛОН / очко)) * 1000) / 1000;
    if (k - 1 < МЁРТВАЯ || !matchMedia(КОМПЬЮТЕР).matches) { k = 1; }
    корень.setAttribute("data-очко", очко.toFixed(3));      // чтобы проверка могла сказать числа вслух
    корень.setAttribute("data-поправка", k.toFixed(3));
    if (k === 1) { return; }
    for (i = 0; i < ТОКЕНЫ.length; i++) {
      var было = стиль.getPropertyValue(ТОКЕНЫ[i]).trim();
      if (было) { корень.style.setProperty(ТОКЕНЫ[i], "calc((" + было + ") * " + k + ")"); }
    }
  }

  применить();

  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(применить); }

  addEventListener("resize", function () { ждём = ждём || requestAnimationFrame(применить); });
})();
</script>
</head>

<p><a class="кнопка" href="index.html">На главную</a></p>
</div>
</section>

<nav class="подвал-сайта__меню" aria-label="Страницы сайта">
<a href="index.html">Главная</a>
</nav>

<script>
(function () {
  var шапка = document.querySelector(".шапка-сайта, .шапка--с-меню");
  var кнопка = шапка && шапка.querySelector(".шапка-сайта__кнопка");
  if (!кнопка) { return; }
  кнопка.hidden = false;
  шапка.classList.add("шапка-сайта--с-кнопкой");
  кнопка.addEventListener("click", function () {
    var открыта = шапка.classList.toggle("шапка-сайта--открыта");
    кнопка.setAttribute("aria-expanded", открыта ? "true" : "false");
  });
})();
</script>
